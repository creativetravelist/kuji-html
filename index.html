<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon 30th ANNIVERSARY - 抽賞大廳</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        max-width: 480px;
        margin: 0 auto;
      }

      .status-bar {
        background-color: #f5f5f5;
        color: #000;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
      }

      .status-left {
        font-weight: bold;
      }

      .status-right {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .status-icons {
        display: flex;
        gap: 2px;
        font-size: 12px;
      }

      .header {
        background: #66f4b9;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: bold;
        color: #043522;
      }

      .header-back {
        cursor: pointer;
        font-size: 24px;
        width: 24px;
        height: 24px;
      }

      .header-right {
        font-weight: bold;
        color: #333;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-right-pointes {
        background-color: #e5fff4;
        border-radius: 20px;
        padding: 8px 10px;
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .header-right img {
        width: 22px;
        height: 22px;
      }

      .header-right span {
        font-size: 11px;
        align-self: flex-end;
      }

      .container {
        max-width: 100%;
        padding: 0;
      }

      .banner-section {
        background: url("images/banner.png") center/cover no-repeat;
        padding: 16px;
        text-align: center;
        width: 100%;
        height: 130px;
      }

      .banner-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #fff;
      }

      .banner-subtitle {
        font-size: 12px;
        color: #999;
      }

      .hot-label {
        display: inline-block;
        background-color: #ffc107;
        color: #000;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .prize-list-section {
        background-color: #000;
        padding: 16px;
      }

      .section-title {
        font-size: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 2px solid #fff;
        padding: 4px 6px;
      }

      .prize-count {
        background-color: #ffe5ef;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        color: #180c88;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .prize-count::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: #c8548c;
        border-radius: 50%;
        display: inline-block;
      }

      .prize-items {
        display: flex;
        gap: 12px;
        overflow-x: auto;
      }

      .prize-item {
        width: calc(20% - 9.6px);
        aspect-ratio: 1/1;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        flex-shrink: 0;
        cursor: pointer;
        transition: transform 0.2s;
        overflow: hidden;
      }
      .prize-item img {
        width: 100%;
      }

      .prize-item:hover {
        transform: scale(1.05);
      }

      .prize-item:last-child {
        background-color: #e8f5e9;
        color: #078b59;
        font-size: 24px;
        font-weight: bold;
      }

      .pool-section {
        background-color: #000;
        padding: 16px;
      }

      .pool-title {
        font-size: 16px;
        margin-bottom: 4px;
        border-left: 2px solid #fff;
        padding: 4px 6px;
      }

      .pool-grid {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 16px;
        justify-content: space-between;
      }

      .pool-item {
        background: url("images/lottery.png") center/contain no-repeat;
        padding: 6px;
        text-align: center;
        font-size: clamp(6px, calc(6px + 1.2vw), 14px);
        cursor: pointer;
        transition: transform 0.2s;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        width: calc(20% - 6.4px);
        min-height: 60px;
        position: relative;
        color: #000;
        white-space: nowrap;
        gap: 4px;
      }

      .pool-item:hover {
        transform: scale(1.05);
      }

      .pool-item.rare {
        background: url("images/lottery.png") center/contain no-repeat;
      }

      .gem-icon {
        width: 16px;
        height: 16px;
        display: inline-block;
        position: static;
        margin: 0;
      }

      .action-section {
        display: flex;
        gap: 16px;
        padding: 0 16px;
        margin: 16px 0;
      }

      .delete-draws-section {
        background: #b0a7fb;
        padding: 12px 16px;
        margin: 0;
        border-radius: 10px;
        text-align: center;
        flex: 1;
      }

      .delete-draws-label {
        font-size: 14px;
        margin-bottom: 2px;
      }

      .delete-draws-count {
        font-size: 20px;
        font-weight: bold;
      }

      .action-button {
        background: url("images/waiting.png") center / 100% 100% no-repeat;
        padding: 16px;
        margin: 0;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s;
        flex: 2;
      }

      .action-button:hover {
        transform: scale(1.02);
      }

      .action-button-main {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        margin-bottom: 2px;
      }

      .action-button-sub {
        font-size: 12px;
        color: #666;
      }

      .notification-section {
        background: #005c36;
        color: #a6fcd8;
        padding: 12px 12px;
        margin: 16px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .notification-icon {
        font-size: 20px;
        width: 22px;
        height: 22px;
      }

      .notification-text {
        flex: 1;
      }

      .notification-sound {
        font-size: 18px;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        .pool-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
    </style>
  </head>
