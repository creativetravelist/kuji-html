<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon 30th ANNIVERSARY - 商品詳情</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .light-theme {
        height: 100vh;
        background-color: #f4f4f4;
      }
      .product-image {
        width: 100%;
        height: auto;
      }

      .product-image img {
        width: 100%;
        height: auto;
        display: block;
      }

      .product-title {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        text-align: center;
      }

      .product-content {
        background-color: #f4f4f4;
        padding: 16px;
      }

      .status-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .status-btn {
        flex: 1;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        font-size: 12px;
        transition: transform 0.2s;
      }

      .status-btn:hover {
        transform: scale(1.02);
      }

      .status-btn.active {
        background-color: #180d88;
        color: #fff;
      }

      .status-btn.secondary {
        background-color: #ffe900;
        color: #01a94d;
      }

      .status-btn.tertiary {
        background-color: #01a94d;
        color: #ffe900;
      }

      .status-value {
        font-size: 18px;
        margin-top: 4px;
        font-weight: bold;
      }

      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 16px;
        margin-bottom: 12px;
        font-weight: bold;
        color: #01a94d;
        padding: 0 8px;
      }

      .section-title-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-title-left::before {
        content: "";
        width: 2px;
        height: 20px;
        background-color: #01a94d;
      }

      .section-title-right {
        font-size: 12px;
        color: #01a94d;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .prize-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .prize-card {
        width: 100%;
        height: auto;
        border-radius: 8px;
        padding: 0;
        cursor: pointer;
        overflow: hidden;
      }

      .prize-card img {
        width: 100%;
        height: auto;
        display: block;
      }

      .prize-card:hover {
        transform: scale(1.02);
      }

      .prize-card-name {
        font-size: 12px;
        margin-bottom: 4px;
        font-weight: bold;
      }

      .prize-progress {
        background: #444;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .prize-progress-bar {
        background: #66f4b9;
        height: 100%;
        width: 100%;
      }

      .prize-progress-text {
        font-size: 11px;
        color: #999;
      }
    </style>
  </head>
  <body class="light-theme">
    <!-- 頭部 -->
    <div class="header header-v1">
      <div class="header-left">
        <img
          src="images/components/icons/arrow-v2.png"
          class="header-back"
          alt="back"
          onclick="history.back()"
        />
        <span>抽賞內容</span>
      </div>
      <div class="header-right">
        <div class="header-right-pointes">
          <img src="images/components/icons/money.png" alt="money" /> 1,000 <span>PTS</span>
        </div>
        <img src="images/components/icons/message-v2.png" class="header-message" alt="message" />
      </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
      <!-- 商品圖片 -->
      <div class="product-image">
        <img src="images/pages/banner-v2.png" alt="product banner" />
      </div>

      <!-- 內容區域 -->
      <div class="product-content">
        <!-- 狀態按鈕 -->
        <div class="status-buttons">
          <div class="status-btn active">
            剩餘抽數
            <div class="status-value">80 pts</div>
          </div>
          <div class="status-btn secondary">
            單次抽賞
            <div class="status-value">40 pts</div>
          </div>
          <div class="status-btn tertiary">
            當前狀態
            <div class="status-value">販售中</div>
          </div>
        </div>

        <!-- 賞品清單 -->
        <div class="section-title">
          <div class="section-title-left">賞品清單</div>
          <div class="section-title-right">
            剩餘數量由多到少排序 <span>▼</span>
          </div>
        </div>
        <div class="prize-grid">
          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-1.png" alt="prize 1" />
          </div>

          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-2.png" alt="prize 2" />
          </div>

          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-3.png" alt="prize 3" />
          </div>

          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-4.png" alt="prize 4" />
          </div>

          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-5.png" alt="prize 5" />
          </div>

          <div class="prize-card" onclick="goToLotteryDetails()">
            <img src="images/prizes/ticket-card-6.png" alt="prize 6" />
          </div>
        </div>
      </div>

      <div class="bottom-space"></div>
    </div>

    <!-- 底部導航 -->
    <div class="footer-nav">
      <div class="nav-item active">
        <img src="images/components/icons/home.png" alt="home" class="nav-icon" />
        <div>首頁</div>
      </div>
      <div class="nav-item">
        <img src="images/components/icons/compass.png" alt="compass" class="nav-icon" />
        <div>探索</div>
      </div>
      <div class="nav-item">
        <img src="images/components/icons/box.png" alt="box" class="nav-icon" />
        <div>出貨</div>
      </div>
      <div class="nav-item">
        <img src="images/components/icons/user.png" alt="user" class="nav-icon" />
        <div>帳戶</div>
      </div>
    </div>

    <script>
      function goToLotteryDetails() {
        window.location.href = "lottery-details.html";
      }
    </script>
  </body>
</html>
