<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon 30th ANNIVERSARY - 抽獎詳情</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          sans-serif;
        background-color: #f4f4f4;
        color: #fff;
        max-width: 480px;
        margin: 0 auto;
      }

      .status-bar {
        background-color: #f5f5f5;
        color: #000;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
      }

      .status-left {
        font-weight: bold;
      }

      .status-right {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .header {
        background: #66f4b9;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-v1 {
        background: #01a94d;
        color: #fff;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
      }

      .header-back {
        cursor: pointer;
        font-size: 28px;
        width: 28px;
        height: 28px;
      }

      .header-right {
        font-weight: bold;
        color: #333;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-right-pointes {
        background-color: #e5fff4;
        border-radius: 20px;
        padding: 8px 10px;
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .header-right img {
        width: 22px;
        height: 22px;
      }

      .header-right span {
        font-size: 11px;
        align-self: flex-end;
      }

      .container {
        max-width: 100%;
        padding: 0;
      }

      .lottery-image {
        width: 100%;
        height: auto;
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .lottery-image img {
        width: 100%;
        height: auto;
        display: block;
        position: relative;
        z-index: 1;
      }

      .lottery-title {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        text-align: center;
        position: absolute;
        bottom: 16px;
        left: 0;
        right: 0;
        z-index: 2;
      }

      .hot-label {
        position: absolute;
        bottom: 20px;
        left: 16px;
        background-color: #ffc107;
        color: #000;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .content {
        background-color: #f4f4f4;
        padding: 16px;
      }

      .lottery-items {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .lottery-item {
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .lottery-item img {
        width: 100%;
        height: auto;
        display: block;
      }

      .lottery-item:hover {
        transform: scale(1.02);
      }

      .share-section {
        margin: 10px 0;
        padding: 6px 0;
      }

      .share-title {
        font-size: 14px;
        font-weight: bold;
        color: #01a94d;
        margin-bottom: 12px;
      }

      .share-buttons-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .share-buttons {
        display: flex;
        gap: 12px;
        flex: 1;
      }

      .share-btn {
        width: 28px;
        height: 28px;
        display: block;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .share-btn:hover {
        transform: scale(1.08);
      }

      .enter-lottery-button {
        width: 100%;
        margin: 10px auto;
      }

      .share-link {
        color: #0066cc;
        cursor: pointer;
        font-size: 12px;
        text-decoration: underline;
        white-space: nowrap;
      }

      .notice-section {
        background-color: #fff;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 20px;
      }

      .notice-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #01a94d;
      }

      .notice-icon {
        width: 16px;
        height: 16px;
        display: block;
      }

      .notice-content {
        font-size: 12px;
        line-height: 1.6;
        color: #01a94d;
      }

      .notice-item {
        margin-bottom: 6px;
      }

      .bottom-space {
        height: 80px;
      }
    </style>
  </head>
  <body>
    <!-- 頭部 -->
    <div class="header header-v1">
      <div class="header-left">
        <img
          src="images/components/icons/arrow-v2.png"
          class="header-back"
          alt="back"
          onclick="history.back()"
        />
        <span>抽賞內容</span>
      </div>
      <div class="header-right">
        <div class="header-right-pointes">
          <img src="images/components/icons/money.png" alt="money" /> 1,000
          <span>PTS</span>
        </div>
        <img
          src="images/components/icons/message-v2.png"
          class="header-message"
          alt="message"
        />
      </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
      <!-- 抽獎圖片 -->
      <div class="lottery-image">
        <img src="images/pages/banner-v2.png" alt="lottery banner" />
      </div>

      <!-- 內容區域 -->
      <div class="content">
        <!-- 抽籤選項 -->
        <div class="lottery-items">
          <div class="lottery-item">
            <img src="images/prizes/ticket-card-1.png" alt="prize 1" />
          </div>
          <div class="lottery-item">
            <img src="images/prizes/ticket-card-2.png" alt="prize 2" />
          </div>
        </div>

        <!-- 分享區 -->
        <div class="share-section">
          <div class="share-title">分享</div>
          <div class="share-buttons-wrapper">
            <div class="share-buttons">
              <img
                src="images/components/social/line.png"
                alt="LINE"
                class="share-btn"
              />
              <img
                src="images/components/social/fb.png"
                alt="Facebook"
                class="share-btn"
              />
              <img
                src="images/components/social/instagram.png"
                alt="Instagram"
                class="share-btn"
              />
              <img
                src="images/components/social/threads.png"
                alt="Threads"
                class="share-btn"
              />
              <img
                src="images/components/social/x.png"
                alt="X"
                class="share-btn"
              />
            </div>
            <div class="share-link">複製連結</div>
          </div>
        </div>

        <!-- 抽籤須知 -->
        <div class="notice-section">
          <div class="notice-title">
            <img
              src="images/components/icons/info.png"
              alt="info"
              class="notice-icon"
            />
            抽賞須知
          </div>
          <div class="notice-content">
            <div class="notice-item">
              • 本活動為線上抽獎商品，抽獎後概不接受退換貨。
            </div>
            <div class="notice-item">
              • 運費將於出貨時另行計算，支援超商取貨及宅配。
            </div>
            <div class="notice-item">
              • 預購商品預計於 2026 年 Q3 陸續出貨，請耐心等候。
            </div>
            <div class="notice-item">
              • 「最後賞」將於該箱最後一張票券抽出時自動獲得。
            </div>
            <div class="notice-item">• LUCKYO! 保留活動最終解釋權。</div>
          </div>
        </div>

        <!-- 進入按鈕 -->
        <img
          src="images/components/buttons/btn-solid.png"
          class="enter-lottery-button"
          alt="enter"
          onclick="goToLotteryHall()"
        />
      </div>

      <div class="bottom-space"></div>
    </div>

    <!-- 底部導航 -->
    <div class="footer-nav">
      <div class="nav-item active">
        <img
          src="images/components/icons/home.png"
          alt="home"
          class="nav-icon"
        />
        <div>首頁</div>
      </div>
      <div class="nav-item">
        <img
          src="images/components/icons/compass.png"
          alt="compass"
          class="nav-icon"
        />
        <div>探索</div>
      </div>
      <div class="nav-item">
        <img src="images/components/icons/box.png" alt="box" class="nav-icon" />
        <div>出貨</div>
      </div>
      <div class="nav-item">
        <img
          src="images/components/icons/user.png"
          alt="user"
          class="nav-icon"
        />
        <div>帳戶</div>
      </div>
    </div>

    <script>
      function goToLotteryHall() {
        window.location.href = "lottery-hall.html";
      }
    </script>
  </body>
</html>
